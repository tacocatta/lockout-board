<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lockout Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE everyday-competitive: a live contest scoreboard run by student judges
   IDEA a sheet of contest graph paper turned into a claim board, team colours stamped on solved squares
   PICTURE the 4x4 lockout board itself, large, squares filling with team colour
   COLOUR white graph paper, near-black ink, vermilion accent for time and alerts, ten team colours
   TYPE Archivo 800-900 for numbers and titles, Archivo 400-600 for text
   LAYOUT judge: entry column + board/leaderboard column; projector: title+clock row, board 2/3 + leaderboard 1/3; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1014);--ink:light-dark(#121418,#eef0f3);--mute:light-dark(#596070,#9aa2b0);--line:light-dark(#d5dae2,#2b303a);--grid:light-dark(#edf1f6,#161920);--panel:light-dark(#ffffff,#14171d);--soft:light-dark(#f4f6f9,#1b1f27);--acc:#ff4a1c;--ok:#1d9a52;--bad:#d7263d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;padding:8px 14px;font-weight:600}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
input,select{font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
.prime{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.warnb{background:var(--bad);color:#fff;border-color:var(--bad)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px max(3vw,16px);border-bottom:2px solid var(--ink);background:var(--bg)}
.brand{font-weight:900;font-size:22px;letter-spacing:-.02em;margin-right:auto}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;min-height:44px;display:inline-flex;align-items:center}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
.clockbox{display:flex;align-items:center;gap:10px}
.clock{font-weight:900;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.clock.low{color:var(--acc)}
.hint{color:var(--mute);font-size:14px;white-space:nowrap}
main{padding:20px max(3vw,16px) 40px;max-width:1400px;margin:0 auto}
.sample{background:var(--ink);color:var(--bg);padding:10px max(3vw,16px);font-size:15px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.sample button{background:transparent;color:inherit;border-color:currentColor;min-height:36px;padding:4px 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card+.card{margin-top:20px}
h2{font-size:18px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;margin:16px 0 8px;font-weight:700;color:var(--mute)}
h3:first-child{margin-top:0}
.teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left;font-size:15px}
.sw{width:16px;height:16px;border-radius:4px;flex:none}
.tbtn[aria-pressed=true],.pbtn[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pbtn{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;text-align:left;padding:8px 10px;position:relative}
.pbtn b{font-size:20px;font-weight:900}
.pbtn small{font-size:13px;color:var(--mute);text-align:right}
.pbtn .own{position:absolute;right:6px;top:6px;display:flex;gap:3px}
.pbtn .own i{width:10px;height:10px;border-radius:3px;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input{flex:1 1 160px;width:auto}
.key{font-size:14px;color:var(--mute)}
.key span{filter:blur(6px);transition:filter .15s;background:var(--soft);padding:2px 8px;border-radius:6px;color:var(--ink);font-weight:700}
.key span:hover,.key span:focus{filter:none}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:600;background:var(--soft)}
.msg.ok{background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:light-dark(#0d5a2f,#8fe3b1)}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:light-dark(#8a1222,#ff9aa8)}
.msg.warn{background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:8px}
.cell{position:relative;border:2px solid var(--ink);border-radius:12px;background:var(--panel);padding:10px;aspect-ratio:1.35;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cell .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cell .num{font-weight:900;font-size:clamp(18px,2.2vw,34px);line-height:1}
.cell .pts{font-weight:800;font-size:clamp(14px,1.5vw,22px);font-variant-numeric:tabular-nums}
.cell .topic{font-size:clamp(12px,1vw,15px);line-height:1.2;opacity:.85}
.cell .who{font-weight:900;font-size:clamp(15px,1.8vw,28px);line-height:1.05;letter-spacing:-.02em}
.cell.locked{border-style:dashed;border-color:var(--line);color:var(--mute);background:var(--soft)}
.cell.closed::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.16) 10px 12px);pointer-events:none}
.steal{display:inline-flex;align-items:center;gap:5px;font-size:clamp(11px,.95vw,14px);font-weight:700;background:rgba(255,255,255,.92);color:#121418;border-radius:6px;padding:2px 6px;align-self:flex-start;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steal i{width:9px;height:9px;border-radius:2px;flex:none}
.mini .cell{aspect-ratio:1.5;padding:6px 8px;border-radius:9px}
.mini .num{font-size:16px}.mini .pts{font-size:13px}.mini .topic{display:none}.mini .who{font-size:14px}.mini .steal{font-size:11px}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{transform:scale(1.08);box-shadow:0 0 0 8px var(--acc)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
.lb{display:grid;gap:6px}
.lbr{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center}
.lbr .rk{font-weight:900;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.bar{position:relative;height:34px;border-radius:8px;background:var(--soft);overflow:hidden;display:flex;align-items:center}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:8px}
.bar>span{position:relative;padding:0 10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbr .sc{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;min-width:2.6em}
.sub{font-size:13px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{font-size:14px;color:var(--mute);display:grid;gap:4px}
textarea{width:100%;min-height:120px;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--ink)}
input[type=color]{padding:4px;width:56px}
.qbox{border:2px solid var(--ink);border-radius:12px;padding:14px 16px;background:var(--panel)}
.qbox.empty{border-style:dashed;border-color:var(--line);color:var(--mute);font-size:15px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;color:var(--mute);font-weight:600}
.qtext{margin:8px 0 12px;font-size:17px;line-height:1.45}
.abig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:10px 14px}
.abig span{font-size:14px;color:var(--mute);font-weight:600}
.abig b{font-size:clamp(28px,3.4vw,40px);font-weight:900;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.big{flex:1 1 140px;min-height:52px;font-size:18px}
details.auto{margin-top:12px}
details.auto summary{cursor:pointer;color:var(--mute);font-size:15px;min-height:32px}
.mv{display:flex;gap:4px;margin-top:6px}
.mv button{min-height:32px;min-width:32px;padding:0 6px;font-size:14px}
.ptable td{vertical-align:top}
.ptable td:nth-child(4){min-width:260px}
.ptable td:nth-child(3),.ptable td:nth-child(2){min-width:96px}
.ptable td:nth-child(5){min-width:110px}
textarea.ptext{min-height:88px;resize:vertical;margin-top:6px;font:15px/1.4 Archivo,system-ui,sans-serif}
mjx-container{font-size:110%}
mjx-container[display=true]{margin:.4em 0 !important}
.qv{display:flex;flex-direction:column;gap:16px;min-height:100%}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.qcard{display:flex;flex-direction:column;gap:10px;text-align:left;font-weight:400;border:2px solid var(--ink);border-top:10px solid var(--tc,var(--ink));border-radius:12px;padding:12px 16px 14px;background:var(--panel);min-height:0}
.qcard.done{opacity:.45}
.pboard{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;--qf:18px;flex:1;min-height:0}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;font-weight:400;border:2px solid var(--ink);border-radius:12px;padding:10px 14px 12px;background:var(--panel);min-height:0;position:relative;overflow:hidden}
.pcard .qc-top{color:inherit;opacity:1}
.pcard .qc-top span:not(.qpts){opacity:.75}
.pcard .qc-top b,.pcard .qc-top .qpts{color:inherit}
.pcard .qc-top span:not(.qpts):not(.btag){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:max(12px,calc(var(--qf)*.62))}
.pcard .qc-top b{font-size:calc(var(--qf)*1.25)}
.pcard .qc-top .qpts{font-size:calc(var(--qf)*1.05)}
.pcard .qc-text{font-size:var(--qf);line-height:1.32;flex:1;min-height:0;overflow:hidden}
.pchip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:#121418;border-radius:6px;padding:1px 7px}
.pchip i{width:10px;height:10px;border-radius:2px;display:block}
.pcard .qc-st{font-size:max(12px,calc(var(--qf)*.7));flex-wrap:wrap;gap:4px 6px}
.pcard.closed{opacity:.55}
.pcard.closed::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.14) 10px 12px);pointer-events:none}
.pjmain{display:flex;flex-direction:column;gap:10px;min-height:0}
.lbn{display:grid;gap:4px;min-width:0}
.nm{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}
.pj .nm{font-size:clamp(15px,1.3vw,22px)}
.pj .track{height:10px}
.pj .lb{gap:clamp(6px,1.2vh,14px)}
@media(max-width:980px){.pboard{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}.pcard .qc-text{overflow:visible}}
@media(max-width:600px){.pboard{grid-template-columns:minmax(0,1fr)}}
.qc-top{display:flex;align-items:baseline;gap:10px;font-size:15px;color:var(--mute);font-weight:600}
.qc-top b{font-size:clamp(22px,1.8vw,30px);font-weight:900;color:var(--ink)}
.qc-top .qpts{margin-left:auto;font-size:clamp(18px,1.4vw,24px);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.qc-text{font-size:clamp(17px,1.35vw,24px);line-height:1.4;flex:1}
.qc-st{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.qc-st i{width:12px;height:12px;border-radius:3px;flex:none}
.qlock{display:flex;flex-wrap:wrap;gap:4px 28px;border:2px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--mute);font-weight:600;font-size:clamp(16px,1.2vw,20px)}
.zoom{position:fixed;inset:0;z-index:8;background:color-mix(in srgb,var(--bg) 94%,transparent);display:grid;place-items:center;padding:4vw;cursor:zoom-out}
.zcard{width:min(1150px,100%);border:3px solid var(--ink);border-top:16px solid var(--tc,var(--ink));border-radius:18px;background:var(--panel);padding:clamp(20px,3vw,44px);display:grid;gap:clamp(14px,2vw,28px)}
.zcard .qc-top{font-size:clamp(16px,1.4vw,22px)}
.zcard .qc-top b{font-size:clamp(36px,4vw,64px)}
.zcard .qc-top .qpts{font-size:clamp(28px,2.6vw,44px)}
.ztext{font-size:clamp(28px,3.3vw,54px);line-height:1.3;letter-spacing:-.01em}
.zcard .qc-st{font-size:clamp(16px,1.4vw,22px)}
.pjbar{position:fixed;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;opacity:.3;z-index:9}
.pjbar:hover,.pjbar:focus-within{opacity:1}
.pjbar button{min-height:36px;padding:4px 10px;font-size:13px}
.pjbar button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cell[data-act]{cursor:zoom-in}
.tag{display:inline-block;font-size:12px;font-weight:800;background:var(--acc);color:#fff;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.soft{background:var(--ink);color:var(--bg)}
.pj .tag{font-size:clamp(12px,.9vw,15px)}
.btag{flex:none;font-weight:900;background:var(--acc);color:#fff;border-radius:6px;padding:0 6px;font-size:max(12px,calc(var(--qf)*.7));white-space:nowrap}
.pcard .qc-top .btag{margin-left:auto}
.pcard .qc-top .btag+.qpts{margin-left:6px}
.pjside{display:flex;flex-direction:column;gap:16px;min-height:0}
.rules{display:grid;gap:6px;font-size:clamp(13px,.95vw,16px);color:var(--mute);border-top:2px solid var(--line);padding-top:10px}
.rules span{line-height:1.3}
.settings small{display:block;font-size:13px;color:var(--mute);line-height:1.35}
/* projector */
body.proj header,body.proj .sample{display:none}
body.proj main{max-width:none;padding:18px 2.5vw;height:100%}
.pj{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:16px 28px;height:100%}
.pj-top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.pj-title{font-weight:900;font-size:clamp(32px,4vw,56px);letter-spacing:-.03em;line-height:1.05;margin:0}
.pj-clock{text-align:right}
.pj-clock .clock{font-size:clamp(48px,7vw,104px);line-height:.95}
.pj-clock .hint{font-size:clamp(14px,1.3vw,20px);display:block}
.pj .lb .bar{height:clamp(32px,4.2vh,48px)}
.pj .lbr .sc{font-size:clamp(20px,2vw,32px)}
.pj .bar>span{font-size:clamp(15px,1.3vw,20px)}
.exit{position:fixed;right:10px;bottom:10px;opacity:.35;min-height:36px;padding:4px 10px;font-size:13px}
.exit:hover{opacity:1}
.banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:22px 36px;border-radius:18px;font-weight:900;font-size:clamp(28px,4vw,60px);letter-spacing:-.02em;box-shadow:0 10px 0 rgba(0,0,0,.25);pointer-events:none;z-index:9;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.flash,.banner{animation:none}}
@media(max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}.pj{grid-template-columns:minmax(0,1fr);height:auto}}
@media(max-width:600px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.cell .topic{display:none}.clock{font-size:24px}table{font-size:13px}th,td{padding:6px 4px}.brand{font-size:19px}}
</style>

<body>
<header>
  <div class="brand">Lockout Board</div>
  <nav aria-label="Views">
    <a href="#judge" data-v="judge">Judge</a>
    <a href="#projector" data-v="projector">Projector</a>

  </nav>
  <div class="clockbox">
    <div><div class="clock" id="clock">38:00</div><div class="hint" id="wavehint"></div></div>

  </div>

<script>
{
const TIERS={Easy:10,Medium:20,Hard:30,Boss:50};
const COLORS=['#e63946','#f4802a','#f2c230','#8cc63f','#1f9d55','#14a3a3','#2f6fe0','#7b4fd6','#e05aa6','#8a5a3c'];
const NAMES=['Aces','Twos','Threes','Fours','Fives','Sixes','Sevens','Eights','Nines','Tens'];
const SAMPLE=[
 [1,'Easy','Algebra','If $3x + 7 = 31$, what is the value of $5x$?','40'],
 [1,'Easy','Number Theory','What is the sum of the digits of the smallest 4-digit multiple of $7$?','2'],
 [1,'Medium','Geometry','A right triangle has legs of length $9$ and $12$. How long is the altitude to the hypotenuse?','36/5'],
 [1,'Hard','Counting & Probability','How many 3-digit positive integers have digits that add up to $10$?','54'],
 [1,'Easy','Logic & Puzzles','Today is Friday. What day of the week will it be $100$ days from today?','Sunday|sun'],
 [1,'Easy','Counting & Probability','Eight people each shake hands once with everyone else. How many handshakes are there?','28'],
 [1,'Medium','Algebra','The average of five numbers is $12$. One number is removed and the average of the other four is $10$. What number was removed?','20'],
 [1,'Medium','Number Theory','How many positive integers $n < 100$ have exactly three positive divisors?','4'],
 [2,'Easy','Geometry','A rectangle has perimeter $30$ and length $9$. What is its area?','54'],
 [2,'Medium','Counting & Probability','A bag has $3$ red and $5$ blue marbles. Two are drawn without replacement. What is the probability that they are the same colour?','13/28'],
 [2,'Hard','Algebra','How many ordered pairs of positive integers $(x, y)$ satisfy $$\\frac{1}{x} + \\frac{1}{y} = \\frac{1}{6}\\,?$$','9'],
 [2,'Boss','Number Theory','The sum $1 + 2 + 3 + \\cdots + n$ is a 3-digit number whose digits are all the same. What is $n$?','36'],
 [3,'Easy','Logic & Puzzles','How many times is the digit $7$ written when you write every integer from $1$ to $100$?','20'],
 [3,'Medium','Geometry','A circle is inscribed in a square with side $10$. Using $\\pi \\approx 3.14$, what is the area inside the square but outside the circle?','21.5'],
 [3,'Hard','Number Theory','What is the remainder when $2^{2026}$ is divided by $7$?','2'],
 [3,'Boss','Geometry','Rectangle $ABCD$ has $AB = 8$ and $BC = 6$. It is folded so that $A$ lands on $C$. How long is the crease?','15/2']];
const KEY='lockout-board-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEF={duration:38,waves:[0,12,24],penalty:0,chain:[100,100,50,25],cap:3,bountyAmt:5,bountyEvery:5,cbTeams:3,cbMult:1.5,sweep:20};
function sampleProblems(){return SAMPLE.map(([wave,tier,topic,text,answer],i)=>({id:i+1,wave,tier,pts:TIERS[tier],topic,text,answer}));}
function fresh(sample){
  const s={v:3,teams:NAMES.map((n,i)=>({id:i,name:n,color:COLORS[i]})),problems:sampleProblems(),
    settings:JSON.parse(JSON.stringify(DEF)),timer:{running:false,startedAt:0,elapsed:0},openedAt:{},events:[],seq:0,sample:false,sampleProblems:true,texSamples:true};
  if(!sample){s.problems.forEach(p=>{p.text='';p.answer='';});s.sampleProblems=false;}
  if(sample){
    const ev=[[1.2,'solve',6,1],[1.9,'solve',0,2],[2.5,'wrong',2,3],[3.4,'solve',8,5],[4.1,'solve',0,1],[5.4,'solve',2,3],[6.2,'solve',1,6],[7,'solve',9,2],[8.3,'solve',0,7],[8.6,'solve',4,1]];
    s.events=ev.map(([m,type,team,prob])=>({id:++s.seq,t:m*60000,type,team,prob}));
    s.timer.elapsed=9*60000;s.sample=true;
  }
  return s;
}
function migrate(s){
  if(!s||!Array.isArray(s.problems))return null;
  if(s.v===1){
    s.problems=s.problems.map(p=>({id:p.n,wave:p.wave,tier:p.tier,pts:p.pts,topic:p.topic,text:'',answer:p.answer||''}));
    s.settings={duration:s.settings.duration,waves:[0,s.settings.wave2,s.settings.wave3],penalty:s.settings.penalty};
    if(s.problems.length===16&&s.problems.every(p=>!p.answer)){s.problems=sampleProblems();s.sampleProblems=true;}
    s.texSamples=true;s.v=2;
  }
  if(s.v===2){
    if(s.sampleProblems&&!s.texSamples){const sp=sampleProblems();s.problems.forEach(p=>{const q=sp.find(x=>x.id===p.id);if(q){p.text=q.text;p.answer=q.answer;}});}
    s.texSamples=true;
    s.events=(s.events||[]).map(e=>e.type==='claim'||e.type==='steal'?{id:e.id,t:e.t,type:'solve',team:e.team,prob:e.prob}:e.type==='wrong'?{id:e.id,t:e.t,type:'wrong',team:e.team,prob:e.prob}:e);
    const t=s.timer||{},el=(t.elapsed||0)+(t.running?Date.now()-t.startedAt:0);
    s.openedAt={};(s.opened||[]).forEach(w=>{const at=(s.settings.waves[w-1]||0)*60000;s.openedAt[w]=Math.min(el,at);});delete s.opened;
    s.settings.penalty=0;s.v=3;
  }
  if(s.v!==3||!s.settings||!Array.isArray(s.settings.waves))return null;
  for(const k in DEF)if(s.settings[k]==null)s.settings[k]=JSON.parse(JSON.stringify(DEF[k]));
  if(!s.openedAt)s.openedAt={};
  return s;
}
function load(hot){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=migrate(JSON.parse(raw));if(s)return s;}}catch(e){}
  const h=hot&&migrate(hot.state);if(h)return h;
  return fresh(false);
}
let state,view='judge';
const ui={team:null,prob:null,answer:'',msg:null,armed:null,lastSeen:null,sig:'',restore:false,copyText:'',zoom:null};
let bc=null;try{bc=new BroadcastChannel('lockout-board');}catch(e){}

const prob=id=>state.problems.find(p=>p.id===id);
const label=id=>{const i=state.problems.findIndex(p=>p.id===id);return i<0?'#?':'#'+(i+1);};
const team=i=>state.teams[i];
const S=()=>state.settings;
const dur=()=>S().duration*60000;
const nW=()=>S().waves.length;
const waveAt=w=>w<=1?0:(S().waves[w-1]==null?Infinity:S().waves[w-1]*60000);
function elapsed(){const t=state.timer;return Math.min(dur(),t.elapsed+(t.running?Date.now()-t.startedAt:0));}
const isOpen=(w,el=elapsed())=>w<=1||state.openedAt[w]!=null||el>=waveAt(w);
const openAt=w=>w<=1?0:Math.min(waveAt(w),state.openedAt[w]!=null?state.openedAt[w]:Infinity);
const chainOf=()=>S().chain&&S().chain.length?S().chain:[100];
const bountyOn=()=>S().bountyAmt>0&&S().bountyEvery>0;
function bountyAt(p,t){if(!bountyOn())return 0;const o=openAt(p.wave);if(!isFinite(o)||t<o)return 0;return Math.floor((t-o)/(S().bountyEvery*60000))*S().bountyAmt;}
const cbOn=()=>S().cbTeams>0&&S().cbMult!==1&&nW()>1;
const cbStart=()=>cbOn()?openAt(nW()):Infinity;
const tkey=s=>String(s||'').trim().toLowerCase();
function topicGroups(){const g={};state.problems.forEach(p=>{const k=tkey(p.topic);if(k)(g[k]=g[k]||[]).push(p.id);});for(const k in g)if(g[k].length<2)delete g[k];return g;}
const ord=n=>n+(n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');
const fmtMult=m=>'×'+(+m.toFixed(2));
function clk(ms){if(!isFinite(ms))return '–';const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stamp(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function inkOn(hex){const h=String(hex).replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);return (.299*r+.587*g+.114*b)>.62?'#121418':'#ffffff';}

function norm(s){return String(s).toLowerCase().replace(/[\s,$]/g,'');}
function num(s){
  s=norm(s).replace(/^[a-z]=/,'');
  const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){const b=parseFloat(m[2]);return b===0?null:parseFloat(m[1])/b;}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return parseFloat(s);
  return null;
}
function matches(a,key){
  if(!String(key).trim())return null;
  if(!String(a).trim())return false;
  return String(key).split('|').some(k=>{const x=num(a),y=num(k);if(x!==null&&y!==null)return Math.abs(x-y)<1e-9*Math.max(1,Math.abs(y));return norm(a)===norm(k);});
}

/* Scores are never stored: every view replays the event list through the current rules. */
const rankCmp=(a,b)=>b.pts-a.pts||a.at-b.at||a.id-b.id;
function derive(now=elapsed()){
  const st=S(),chain=chainOf(),groups=topicGroups(),cb0=cbStart();
  const P={};state.problems.forEach(p=>P[p.id]={solves:[],val:null});
  const T=state.teams.map(t=>({...t,pts:0,wrong:0,solves:0,claims:0,sweeps:[],at:0,atT:0}));
  const evPts={},evInfo={},swept={};
  for(const e of state.events){
    const tm=T[e.team];if(!tm)continue;
    let pts=0;
    if(e.type==='solve'){
      const p=prob(e.prob),R=P[e.prob];
      if(!p||!R||R.solves.length>=chain.length||R.solves.some(x=>x.team===e.team)){evPts[e.id]=0;evInfo[e.id]={void:true};continue;}
      const k=R.solves.length;
      if(!k)R.val=p.pts+bountyAt(p,e.t);
      let mult=1;
      if(cbOn()&&e.t>=cb0){const o=[...T].sort(rankCmp);if(o.findIndex(x=>x.id===tm.id)>=o.length-st.cbTeams)mult=st.cbMult;}
      pts=Math.round(R.val*chain[k]/100*mult);
      const info={k,pct:chain[k],mult,base:pts};
      R.solves.push({team:e.team,pts,id:e.id,t:e.t,k});tm.solves++;if(!k)tm.claims++;
      if(!k&&st.sweep>0){const key=tkey(p.topic),ids=groups[key];
        if(ids&&!swept[key]&&ids.every(id=>P[id].solves[0]&&P[id].solves[0].team===e.team)){swept[key]=e.team;pts+=st.sweep;tm.sweeps.push(p.topic.trim());info.sweep=p.topic.trim();}}
      evInfo[e.id]=info;
    }else if(e.type==='wrong'){pts=-(st.penalty||0);tm.wrong++;}
    else pts=e.pts||0;
    tm.pts+=pts;evPts[e.id]=pts;if(pts){tm.at=e.id;tm.atT=e.t;}
  }
  for(const p of state.problems){const R=P[p.id];R.closed=R.solves.length>=chain.length;R.live=R.solves.length?R.val:p.pts+bountyAt(p,now);R.bounty=R.live-p.pts;R.nextPct=R.closed?null:chain[R.solves.length];R.nextPts=R.closed?0:Math.round(R.live*R.nextPct/100);}
  const rank=[...T].sort(rankCmp);
  const cbActive=cbOn()&&now>=cb0,cbSet=new Set(cbActive?rank.slice(-st.cbTeams).map(t=>t.id):[]);
  return {P,T,rank,evPts,evInfo,cbActive,cbSet,chain,groups,swept};
}
function claimsInWave(d,ti,w){return state.problems.filter(q=>q.wave===w&&d.P[q.id].solves[0]&&d.P[q.id].solves[0].team===ti).length;}
function capped(d,ti,p){return S().cap>0&&!d.P[p.id].solves.length&&claimsInWave(d,ti,p.wave)>=S().cap;}
function wouldSweep(d,ti,p){if(!(S().sweep>0)||d.P[p.id].solves.length)return false;const key=tkey(p.topic),ids=d.groups[key];if(!ids||d.swept[key]!=null)return false;return ids.every(id=>id===p.id||(d.P[id].solves[0]&&d.P[id].solves[0].team===ti));}
function preview(d,ti,p){
  const R=d.P[p.id];if(R.closed)return null;
  const mult=d.cbSet.has(ti)?S().cbMult:1,pts=Math.round(R.live*R.nextPct/100*mult);
  return {pts,mult,k:R.solves.length,pct:R.nextPct,sweep:wouldSweep(d,ti,p)};
}

function isBlank(){return !state.events.length&&!state.problems.some(p=>(p.text||'').trim()||(p.answer||'').trim());}
function loadSample(game){
  const s=fresh(true);
  state.problems=s.problems;state.sampleProblems=true;
  while(nW()<3)S().waves.push((S().waves[S().waves.length-1]||0)+12);
  if(game){state.events=s.events;state.seq=s.seq;state.timer=s.timer;state.openedAt={};state.sample=true;ui.lastSeen=s.seq;}
  ui.prob=null;ui.team=null;ui.msg={t:'ok',s:game?'Sample game loaded: 16 problems and 9 minutes of play.':'Sample problems loaded.'};
  commit();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}try{bc&&bc.postMessage(state);}catch(e){}}
function commit(rerender=true){save();if(rerender)render();}
function addEvent(e){e.id=++state.seq;state.events.push(e);return e;}

function submit(kind){
  const ti=ui.team,id=ui.prob;
  if(ti==null||id==null){ui.msg={t:'warn',s:'Pick a team and a problem first.'};return render();}
  const p=prob(id),d=derive(),R=d.P[id],nm=team(ti).name,L=label(id);
  if(R.solves.some(e=>e.team===ti)){ui.msg={t:'warn',s:nm+' already solved '+L+'.'};return render();}
  if(R.closed){ui.msg={t:'warn',s:L+' is closed.'};return render();}
  let ok;
  if(kind==='check'){ok=matches(ui.answer,p.answer);if(ok===null){ui.msg={t:'warn',s:'No answer key for '+L+' yet. Use Correct or Wrong, or add it in Setup.'};return render();}}
  else ok=kind==='right';
  if(ok&&capped(d,ti,p)){ui.msg={t:'warn',s:nm+' has used all '+S().cap+' claims in wave '+p.wave+'. They can solve '+L+' once another team has claimed it.'};return render();}
  const t=elapsed();
  if(ok){
    const e=addEvent({type:'solve',team:ti,prob:id,t}),d2=derive(),inf=d2.evInfo[e.id];
    ui.msg={t:'ok',s:'Correct. '+nm+(inf.k?' solves '+L+' ('+ord(inf.k+1)+', '+inf.pct+'%)':' claims '+L)+' for +'+inf.base+(inf.mult!==1?' (comeback '+fmtMult(inf.mult)+')':'')+'.'+(inf.sweep?' Topic sweep in '+inf.sweep+': +'+S().sweep+'!':'')+(d2.P[id].closed?' '+L+' is now closed.':'')};
  }else{
    addEvent({type:'wrong',team:ti,prob:id,t});
    ui.msg={t:'bad',s:'Not correct.'+(S().penalty?' '+nm+' loses '+S().penalty+'.':' No penalty.')};
  }
  ui.prob=null;ui.answer='';ui.team=null;
  commit();
}

function cellHTML(p,i,d,el,mini){
  const R=d.P[p.id],s=R.solves,open=isOpen(p.wave,el),L='#'+(i+1);
  const top='<div class="top"><span class="num">'+L+'</span><span class="pts">'+(open?R.live:p.pts)+'</span></div>';
  if(!open)return '<div class="cell locked" data-cell="'+p.id+'">'+top+'<div class="sub">Wave '+p.wave+'</div></div>';
  if(!s.length)return '<div class="cell" data-cell="'+p.id+'">'+top+'<div class="sub">'+(R.bounty?'+'+R.bounty+' bounty':esc(p.tier))+'</div></div>';
  const o=team(s[0].team);
  const more=s.length>1?'<span class="steal">+'+(s.length-1)+' more</span>':'';
  return '<div class="cell'+(R.closed?' closed':'')+'" data-cell="'+p.id+'" style="background:'+esc(o.color)+';color:'+inkOn(o.color)+';border-color:'+esc(o.color)+'">'+top+'<div class="who">'+esc(o.name)+'</div>'+more+'</div>';
}
function cols(n){return n<=4?Math.max(1,n):Math.min(8,Math.ceil(Math.sqrt(n)));}
function boardHTML(d,mini){
  const el=elapsed(),n=state.problems.length;
  if(!n)return '<p class="sub">No problems yet. Add some in Setup.</p>';

function lbHTML(d){
  const max=Math.max(1,...d.rank.map(t=>t.pts));
  return '<div class="lb">'+d.rank.map((t,i)=>'<div class="lbr"><span class="rk">'+(i+1)+'</span><div class="lbn"><span class="nm"><i class="sw" style="background:'+esc(t.color)+'"></i>'+esc(t.name)+(d.cbSet.has(t.id)?'<span class="tag">'+fmtMult(S().cbMult)+'</span>':'')+(t.sweeps.length?'<span class="tag soft">'+t.sweeps.length+(t.sweeps.length>1?' sweeps':' sweep')+'</span>':'')+'</span><div class="track"><i style="width:'+Math.max(0,t.pts/max*100)+'%;background:'+esc(t.color)+'"></i></div></div><span class="sc">'+t.pts+'</span></div>').join('')+'</div>';
}
function evText(e,d){
  const nm=team(e.team)?team(e.team).name:'?',L=label(e.prob),inf=d&&d.evInfo[e.id];
  if(e.type==='solve'){
    if(!inf||inf.void)return nm+' solved '+L+' (not counted)';
    return nm+(inf.k?' solved '+L+' ('+ord(inf.k+1)+', '+inf.pct+'%)':' claimed '+L)+(inf.mult!==1?' '+fmtMult(inf.mult)+' comeback':'')+(inf.sweep?' + swept '+inf.sweep:'');
  }

const signed=n=>(n>0?'+':'')+n;
function rulesLine(){
  const st=S(),r=['Points by solve order: '+chainOf().map(x=>x+'%').join(' · ')];
  if(st.cap>0)r.push('Max '+st.cap+' claims per team per wave');
  if(bountyOn())r.push('Unclaimed problems +'+st.bountyAmt+' every '+st.bountyEvery+' min');
  if(st.sweep>0)r.push('Claim a whole topic: +'+st.sweep);
  if(cbOn())r.push('Bottom '+st.cbTeams+' teams score '+fmtMult(st.cbMult)+' once wave '+nW()+' opens');
  if(st.penalty)r.push('Wrong answer −'+st.penalty);
  return r;

const PROJ=['projector'];

function pcard(p,i,d){
  const R=d.P[p.id],o=R.solves.length?team(R.solves[0].team):null;

function render(){
  const v=view;
  document.body.classList.toggle('proj',PROJ.includes(v));
  document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  document.getElementById('sample').innerHTML=PROJ.includes(v)?'':state.sample?'<div class="sample"><span>A sample game is loaded so you can see the board working. Clear it before the real thing.</span><button data-act="newgame2">Clear sample scores and start fresh</button></div>':isBlank()?'<div class="sample"><span>No problems or answers yet. Add yours in Setup, or try the app with sample data.</span><button data-act="samplegame2">Load sample game</button></div>':'';
  const m=document.getElementById('main');
  m.innerHTML=v==='projector'?projView():v==='log'?logView():v==='setup'?setupView():judgeView();
  if(v!=='setup'){const pr=typeset(m);fit();if(pr)pr.then(fit);}
  tick(true);
}
function typeset(el){
  const M=window.MathJax;
  if(!M||!M.typesetPromise||!el.querySelector('.tex'))return null;
  try{M.typesetClear&&M.typesetClear();return M.typesetPromise([...el.querySelectorAll('.tex')]).catch(()=>{});}catch(e){return null;}
}
function fit(){
  if(view!=='projector')return;
  const g=document.querySelector('.pboard');if(!g)return;
  if(window.innerWidth<=980){g.style.removeProperty('--qf');return;}
  let f=Math.round(Math.min(32,Math.max(14,window.innerHeight/30)));
  const over=()=>[...g.querySelectorAll('.qc-text')].some(t=>t.scrollHeight>t.clientHeight+1);
  g.style.setProperty('--qf',f+'px');
  while(f>10&&over()){f--;g.style.setProperty('--qf',f+'px');}
}
function waveHint(el){
  if(el>=dur())return "Time's up";
  let next=null;for(let w=2;w<=nW();w++)if(!isOpen(w,el)&&(!next||waveAt(w)<next.at))next={w,at:waveAt(w)};
  const run=state.timer.running?'':(el>0?'Paused · ':'Not started · ');
  return run+(next?'Wave '+next.w+' opens in '+clk(next.at-el):(nW()>1?'All waves open':'Event clock'));
}
function bountyStep(el){if(!bountyOn())return 0;let n=0;for(let w=1;w<=nW();w++){const o=openAt(w);if(isFinite(o)&&el>=o)n+=Math.floor((el-o)/(S().bountyEvery*60000));}return n;}
function sigOf(el){let s='';for(let w=2;w<=nW();w++)s+=isOpen(w,el)?'1':'0';return s+'|'+(el>=dur())+'|'+state.timer.running+'|'+bountyStep(el);}
function tick(noRender){
  const el=elapsed();
  if(state.timer.running&&el>=dur()){state.timer.elapsed=dur();state.timer.running=false;commit(false);}
  const sig=sigOf(el);
  if(sig!==ui.sig){
    const prev=ui.sig;ui.sig=sig;
    if(prev&&!noRender){
      if(PROJ.includes(view)){
        const pw=prev.split('|')[0],nw=sig.split('|')[0];let opened=0;
        if(pw.length===nw.length)for(let i=0;i<nw.length;i++)if(pw[i]==='0'&&nw[i]==='1')opened=i+2;
        if(opened)banner('Wave '+opened+' is open!'+(opened===nW()&&cbOn()?' Comeback '+fmtMult(S().cbMult)+' for the bottom '+S().cbTeams:''),'var(--acc)','#fff');
        else if(prev.split('|')[1]==='false'&&el>=dur())banner("Time's up! Slips in now.",'var(--ink)','var(--bg)');
        else if(+sig.split('|')[3]>+prev.split('|')[3]&&state.problems.some(p=>isOpen(p.wave,el)&&!state.events.some(e=>e.type==='solve'&&e.prob===p.id)))banner('Bounty! Unclaimed problems +'+S().bountyAmt,'var(--acc)','#fff');
      }
      return render();
    }
  }
  const txt=clk(dur()-el),low=dur()-el<=60000;
  for(const id of ['clock','pclock']){const c=document.getElementById(id);if(c){c.textContent=txt;c.classList.toggle('low',low);}}
  const h=waveHint(el);
  for(const id of ['wavehint','pwave']){const c=document.getElementById(id);if(c)c.textContent=h;}
  document.querySelectorAll('.cd').forEach(c=>c.textContent=clk(waveAt(+c.dataset.w)-el));
  const b=document.getElementById('tbtn');b.textContent=state.timer.running?'Pause':(el>=dur()?'Done':(el>0?'Resume':'Start'));b.disabled=el>=dur()&&!state.timer.running;
}
let bnT=null;
function banner(text,bg,fg){
  const b=document.getElementById('bn');b.innerHTML='<div class="banner" style="background:'+bg+';color:'+fg+'">'+esc(text)+'</div>';
  clearTimeout(bnT);bnT=setTimeout(()=>b.innerHTML='',3200);
}
function announce(){
  const last=state.events[state.events.length-1],id=last?last.id:0;

    const t=team(last.team),inf=derive().evInfo[last.id];
    if(inf&&!inf.void)banner(t.name+(inf.k?' solves ':' claims ')+label(last.prob)+'  +'+inf.base+(inf.sweep?'  ·  '+inf.sweep+' sweep +'+S().sweep+'!':''),t.color,inkOn(t.color));
    const c=document.querySelector('[data-cell="'+last.prob+'"]');if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');}
  }
  ui.lastSeen=id;
}
function setView(){let h=location.hash.slice(1);if(h==='questions')h='projector';view=['judge','projector','log','setup'].includes(h)?h:'judge';ui.copyText='';ui.restore=false;if(!PROJ.includes(view))ui.zoom=null;render();}
function arm(k,fn){if(ui.armed===k){ui.armed=null;fn();}else{ui.armed=k;render();setTimeout(()=>{if(ui.armed===k){ui.armed=null;render();}},4000);}}
async function copy(text){ui.copyText=text;try{await navigator.clipboard.writeText(text);ui.copyText='';ui.msg={t:'ok',s:'Copied.'};}catch(e){}render();}
function results(){const d=derive();return 'Lockout Board results\n'+d.rank.map((t,i)=>(i+1)+'. '+t.name+' — '+t.pts+' pts ('+t.claims+' claims, '+t.solves+' solves'+(t.sweeps.length?', swept '+t.sweeps.join(' and '):'')+')').join('\n');}
function newGame(){state.events=[];state.seq=0;state.timer={running:false,startedAt:0,elapsed:0};state.openedAt={};state.sample=false;ui.msg=null;ui.lastSeen=0;commit();}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='team'){ui.team=+b.dataset.i;ui.msg=null;if(ui.prob!=null){const d=derive(),p=prob(ui.prob);if(!p||d.P[p.id].solves.some(x=>x.team===ui.team)||capped(d,ui.team,p))ui.prob=null;}render();}
  else if(a==='prob'){ui.prob=+b.dataset.n;ui.msg=null;render();}

  else if(a==='unzoom'){ui.zoom=null;render();}
  else if(a==='fs'){try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{});}catch(err){}}
  else if(a==='copyres')copy(results());
  else if(a==='backup')copy(JSON.stringify(state));
  else if(a==='restoreopen'){ui.restore=true;ui.copyText='';render();}
  else if(a==='restorecancel'){ui.restore=false;render();}
  else if(a==='restore'){try{const s=migrate(JSON.parse(document.getElementById('rs').value));if(!s||!Array.isArray(s.events))throw 0;state=s;ui.restore=false;ui.lastSeen=null;commit();announce();}catch(err){ui.restore=true;render();const r=document.getElementById('rs');if(r)r.placeholder="That didn't look like a Lockout Board backup. Paste the whole text.";}}
  else if(a==='newgame')arm('newgame',newGame);
  else if(a==='newgame2')newGame();
  else if(a==='resettimer')arm('resettimer',()=>{state.timer={running:false,startedAt:0,elapsed:0};state.openedAt={};commit();});
  else if(a==='factory')arm('factory',()=>{state=fresh(false);ui.lastSeen=0;ui.prob=null;commit();});
  else if(a==='addp'){keepScroll(()=>{const last=state.problems[state.problems.length-1];state.problems.push({id:nextId(),wave:last?last.wave:1,tier:'Easy',pts:TIERS.Easy,topic:'',text:'',answer:''});commit();});}
  else if(a==='delp'){const id=+b.dataset.id;keepScroll(()=>arm('delp'+id,()=>{state.problems=state.problems.filter(p=>p.id!==id);if(ui.prob===id)ui.prob=null;commit();}));}
  else if(a==='up'||a==='down'){const i=+b.dataset.i,j=a==='up'?i-1:i+1,P=state.problems;if(j>=0&&j<P.length){[P[i],P[j]]=[P[j],P[i]];keepScroll(()=>commit());}}
  else if(a==='addw'){const W=state.settings.waves,last=W[W.length-1]||0;W.push(Math.min(state.settings.duration,last+10));keepScroll(()=>commit());}
  else if(a==='delw'){const w=+b.dataset.w;state.settings.waves.splice(w-1,1);state.problems.forEach(p=>{if(p.wave>=w)p.wave=Math.max(1,p.wave-1);});const oa={};for(const k in state.openedAt){const x=+k;if(x<w)oa[x]=state.openedAt[k];else if(x>w)oa[x-1]=state.openedAt[k];}state.openedAt=oa;keepScroll(()=>commit());}
  else if(a==='sampleprobs')keepScroll(()=>arm('sampleprobs',()=>loadSample(false)));
  else if(a==='samplegame')keepScroll(()=>arm('samplegame',()=>loadSample(true)));
  else if(a==='samplegame2')loadSample(true);

  const [k,field,idx]=f.split('.'),v=e.target.value;
  if(k==='team'){const t=team(+idx);if(field==='name')t.name=v.trim()||t.name;else t.color=v;}
  else if(k==='prob'){const p=prob(+idx);if(!p)return;if(field==='wave')p.wave=+v;else if(field==='tier'){p.tier=v;p.pts=TIERS[v];const r=e.target.closest('tr').querySelector('[data-f^="prob.pts"]');if(r)r.value=p.pts;}else if(field==='pts')p.pts=Math.max(0,parseInt(v,10)||0);else p[field]=v;if(field==='text'||field==='answer')state.sampleProblems=false;}
  else if(k==='wave'){state.settings.waves[+idx]=Math.max(0,parseFloat(v)||0);}
  else if(k==='set'){
    if(field==='chain'){const c=v.split(/[^0-9.]+/).filter(Boolean).map(Number).filter(x=>isFinite(x)&&x>=0);if(c.length)S().chain=c;e.target.value=chainOf().join(', ');}
    else{let n=Math.max(0,parseFloat(v)||0);if(field==='duration')n=Math.max(1,n);if(field==='cbMult')n=Math.max(1,n);if(['cap','cbTeams','bountyAmt','sweep','penalty'].includes(field))n=Math.round(n);S()[field]=n;e.target.value=n;}
  }
  commit(false);
  if(k==='set'||k==='prob'&&field==='topic'){const y=window.scrollY;render();window.scrollTo(0,y);}
});
function onRemote(s){s=migrate(s);if(!s)return;state=s;if(view!=='setup')render();announce();}
if(bc)bc.onmessage=ev=>onRemote(ev.data);
window.addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue){try{onRemote(JSON.parse(ev.newValue));}catch(err){}}});
window.addEventListener('hashchange',setView);
let rsT=null;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(fit,120);});

function start(hot){
  state=load(hot);
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}));}catch(e){}
  const last=state.events[state.events.length-1];ui.lastSeen=last?last.id:0;
  setView();
  setInterval(()=>tick(false),250);
  let tries=0;const mj=setInterval(()=>{const M=window.MathJax;if(M&&M.startup&&M.startup.promise&&M.typesetPromise){clearInterval(mj);M.startup.promise.then(()=>render()).catch(()=>{});}else if(++tries>150)clearInterval(mj);},200);
}
const h=window.claude&&window.claude.hot;
if(h&&h.ready)h.ready(start);else start(h&&h.data||{});
}
